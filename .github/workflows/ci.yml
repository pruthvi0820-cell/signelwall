name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Plain-JVM module only: packet / DNS / policy / scanner logic, no Android SDK needed.
      - run: ./gradlew --no-daemon :core:test
